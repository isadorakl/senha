<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criptografia simples</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Criptografia simples</h1>
    <p>Digite um texto para convertê-lo usando uma cifra de substituição.</p>

    <label for="texto">Texto</label>
    <textarea id="texto" placeholder="Digite seu texto aqui"></textarea>

    <button id="criptografar">Criptografar</button>

    <label for="resultado">Resultado</label>
    <textarea id="resultado" readonly placeholder="O resultado aparecerá aqui"></textarea>
  </main>

  <script src="script.js"></script>
</body>
</html>
